        if (!state.draggedGuestId && !event.dataTransfer.getData("text/plain")) return;
        event.preventDefault();
        event.stopPropagation();
        node.classList.add("drag-over", "is-drop");
      });
      node.addEventListener("dragleave", () => {
        node.classList.remove("drag-over", "is-drop");
      });
      node.addEventListener("drop", event => {
        event.preventDefault();
        event.stopPropagation();
        node.classList.remove("drag-over", "is-drop");
        const guestId = state.draggedGuestId || event.dataTransfer.getData("text/plain");
        if (guestId) callback(guestId);
      });
    }

    function removeGuestFromSeats(guestId) {
      state.tables.forEach(table => {
        table.seats = table.seats.map(existing => existing === guestId ? null : existing);
      });
    }

    function assignGuestToTable(guestId, tableId) {
      const table = tableById(tableId);
      if (!table) return;
      const emptyIndex = table.seats.findIndex(seat => !seat);
      if (emptyIndex === -1) {
        showToast(`${table.name} no tiene sillas libres.`);
        return;
      }
      assignGuestToSeat(guestId, tableId, emptyIndex);
    }

    function assignGuestToSeat(guestId, tableId, seatIndex) {
      const table = tableById(tableId);
      if (!table || !guestById(guestId)) return;
      const currentGuestInSeat = table.seats[seatIndex];
      let previousSeat = null;

      state.tables.forEach(otherTable => {
        otherTable.seats.forEach((existing, index) => {
          if (existing === guestId) previousSeat = { table: otherTable, index };
        });
      });

      if (currentGuestInSeat && previousSeat) {
        previousSeat.table.seats[previousSeat.index] = currentGuestInSeat;
      } else {
        removeGuestFromSeats(guestId);
      }

      table.seats[seatIndex] = guestId;
      state.selectedTableId = tableId;
      state.selectedElementId = null;
      render();
      scheduleSave();
    }

    function unassignGuest(guestId) {
      removeGuestFromSeats(guestId);
      render();
      scheduleSave();
    }

    function setCapacity(table, nextCapacity) {
      const capacity = Math.max(1, Math.min(120, Number(nextCapacity) || table.capacity));
      const current = table.seats.slice(0, capacity);
      while (current.length < capacity) current.push(null);
      const removed = table.seats.slice(capacity).filter(Boolean);
      table.capacity = capacity;
      table.seats = current;
      if (removed.length) showToast(`${removed.length} invitado(s) quedaron sin asignar.`);
      render();
      scheduleSave();
    }

    function makePositionDraggable(handle, onMove, containerNode = handle) {
      let active = null;
      handle.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        event.preventDefault();
        const roomRect = els.room.getBoundingClientRect();
        const containerRect = containerNode.getBoundingClientRect();
        active = {
          dx: event.clientX - containerRect.left - containerRect.width / 2,
          dy: event.clientY - containerRect.top - containerRect.height / 2,
          roomRect
        };
        handle.setPointerCapture(event.pointerId);
      });
      handle.addEventListener("pointermove", event => {
        if (!active) return;
        const x = ((event.clientX - active.roomRect.left - active.dx) / active.roomRect.width) * 100;
        const y = ((event.clientY - active.roomRect.top - active.dy) / active.roomRect.height) * 100;
        onMove(clamp(x, 5, 95), clamp(y, 5, 95));
      });
      handle.addEventListener("pointerup", () => {
        if (active) scheduleSave();
        active = null;
      });
      handle.addEventListener("pointercancel", () => active = null);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function recenterMap() {
      const wrap = els.mapWrap;
      wrap.scrollLeft = Math.max(0, (wrap.scrollWidth - wrap.clientWidth) / 2);
      wrap.scrollTop = Math.max(0, (wrap.scrollHeight - wrap.clientHeight) / 2);
    }

    function addGuest() {
      const name = prompt("Nombre del invitado");
      if (!name || !name.trim()) return;
      const allergy = prompt("Alergia o intolerancia, si la hay") || "";
      state.guests.push({ id: uid("g"), name: name.trim(), allergy: allergy.trim() });
      render();
      scheduleSave();
    }

    function addTable() {
      const table = makeTable(`Mesa ${state.tables.length + 1}`, 8, "round", 50, 50);
      state.tables.push(table);
      state.selectedTableId = table.id;
      render();
      scheduleSave();
    }

    function renameTable(tableId, value) {
      const table = tableById(tableId);
      if (!table) return;
      const nextName = cleanCell(value) || table.name;
      if (nextName === table.name) {
        renderColumns();
        return;
      }
      table.name = nextName;
      render();
      scheduleSave();
    }

    function addElement() {
      const label = els.elementType.value;
      const dimensions = elementDimensions(label);
      state.room.elements.push({
        id: uid("e"),
        label,
        x: 50,
        y: 50,
        w: dimensions.w,
        h: dimensions.h,
        rotation: 0
      });
      state.selectedElementId = state.room.elements.at(-1).id;
      state.selectedTableId = null;
      render();
      scheduleSave();
    }

    function elementDimensions(label) {
      const sizes = {
        Baile: { w: 3.8, h: 2.4 },
        Escenario: { w: 3, h: 1.8 },
        Puerta: { w: 1.3, h: .25 },
        Buffet: { w: 2.4, h: 1.1 },
        Barra: { w: 2.4, h: 1.1 },
        Guardarropa: { w: 2.2, h: 1.1 }
      };
      return sizes[label] || { w: 2.4, h: 1.1 };
    }

    function deleteSelectedElement() {
      if (!state.selectedElementId) {
        showToast("Selecciona un elemento del plano para borrarlo.");
        return;
      }
      const element = elementById(state.selectedElementId);
      state.room.elements = state.room.elements.filter(item => item.id !== state.selectedElementId);
      state.selectedElementId = null;
      showToast(element ? `${element.label} borrado.` : "Elemento borrado.");
      render();
      scheduleSave();
    }

    function clearAssignments() {
      state.tables.forEach(table => table.seats = Array.from({ length: table.capacity }, () => null));
      render();
      scheduleSave();
    }

    function exportPlan() {
      const seatedIds = new Set();
      const asignaciones = [];
      state.tables.forEach(table => {
        table.seats.forEach((guestId, index) => {
          const guest = guestId ? guestById(guestId) : null;
          if (guest) seatedIds.add(guest.id);
          asignaciones.push({
            Mesa: table.name,
            Silla: index + 1,
            Invitado: guest ? guest.name : "",
            Alergia: guest ? guest.allergy : "",
            Forma: table.shape,
            Capacidad: table.capacity
          });
        });
      });
      unassignedGuests().forEach(guest => asignaciones.push({
        Mesa: "Sin asignar",
        Silla: "",
        Invitado: guest.name,
        Alergia: guest.allergy,
        Forma: "",
        Capacidad: ""
      }));

      // Si por lo que sea no cargó la librería, caemos a CSV para no quedarnos sin export.
      if (!window.XLSX) {
        exportPlanCsv(asignaciones);
        return;
      }

      const invitados = state.guests.map(guest => ({
        Nombre: guest.name,
        Alergia: guest.allergy || "",
        Sentado: seatedIds.has(guest.id) ? "Sí" : "No"
      }));

      const mesas = state.tables.map(table => ({
        Nombre: table.name,
        Forma: table.shape,
        Capacidad: table.capacity,
        Ocupadas: table.seats.filter(Boolean).length
      }));

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(asignaciones), "Asignaciones");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invitados), "Invitados");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mesas), "Mesas");
      XLSX.writeFile(wb, "organizacion-mesas-boda.xlsx");
    }

    function exportPlanCsv(asignaciones) {
      const csv = [
        ["Mesa", "Silla", "Invitado", "Alergia", "Forma"],
        ...asignaciones.map(row => [row.Mesa, row.Silla, row.Invitado, row.Alergia, row.Forma])
      ].map(row => row.map(csvCell).join(";")).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "organizacion-mesas-boda.csv";
      link.click();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("\n", " ");
    }

    els.fileInput.addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) handleFile(file);
      event.target.value = "";
    });

    els.addGuestBtn.addEventListener("click", addGuest);
    els.addTableBtn.addEventListener("click", addTable);
    els.addElementBtn.addEventListener("click", addElement);
    els.deleteElementBtn.addEventListener("click", deleteSelectedElement);
    els.recenterMapBtn.addEventListener("click", recenterMap);
    els.toggleMapBtn.addEventListener("click", () => {
      state.mapCollapsed = !state.mapCollapsed;
      if (state.mapCollapsed) state.mapFullscreen = false;
      syncControls();
      scheduleSave();
    });
    els.fullscreenMapBtn.addEventListener("click", () => {
      state.mapFullscreen = !state.mapFullscreen;
      if (state.mapFullscreen) state.mapCollapsed = false;
      syncControls();
      scheduleSave();
    });
    els.mapWidth.addEventListener("input", event => {
      state.mapPanelWidth = Number(event.target.value);
      syncControls();
      scheduleSave();
    });
    els.exportBtn.addEventListener("click", exportPlan);
    els.clearAssignmentsBtn.addEventListener("click", clearAssignments);

    els.searchInput.addEventListener("input", event => {
      state.filter = event.target.value.trim().toLowerCase();
      renderColumns();
    });

    els.roomShape.addEventListener("change", event => {
      state.room.shape = event.target.value;
      if (state.room.shape === "square") state.room.height = state.room.width;
      render();
      scheduleSave();
    });

    els.roomWidth.addEventListener("input", event => {
      state.room.width = clamp(Number(event.target.value) || 18, 4, 60);
      if (state.room.shape === "square") state.room.height = state.room.width;
      render();
      scheduleSave();
    });

    els.roomHeight.addEventListener("input", event => {
      state.room.height = clamp(Number(event.target.value) || 12, 4, 60);
      if (state.room.shape === "square") state.room.width = state.room.height;
      render();
      scheduleSave();
    });

    els.doorSide.addEventListener("change", event => {
      state.room.door.side = event.target.value;
      render();
      scheduleSave();
    });

    els.doorPos.addEventListener("input", event => {
      state.room.door.pos = Number(event.target.value) / 100;
      renderRoom();
      scheduleSave();
    });

    els.zoomLevel.addEventListener("input", event => {
      state.room.zoom = Number(event.target.value) / 100;
      els.zoomValue.value = `${event.target.value}%`;
      renderRoom();
      scheduleSave();
    });

    els.rotationInput.addEventListener("input", event => {
      const selected = selectedItem();
      if (!selected) return;
      const rotation = Number(event.target.value);
      selected.item.rotation = rotation;
      els.rotationValue.value = `${rotation}°`;
      const selector = selected.type === "table"
        ? `.map-table[data-table-id="${selected.item.id}"]`
        : `.map-element[data-element-id="${selected.item.id}"]`;
      const node = document.querySelector(selector);
      if (node) node.style.setProperty("--rotation", `${rotation}deg`);
      scheduleSave();
    });

    els.columns.addEventListener("change", event => {
      const tableNameId = event.target.dataset.tableName;
      const shapeId = event.target.dataset.shape;
      const capacityId = event.target.dataset.capacity;
      if (tableNameId) {
        renameTable(tableNameId, event.target.value);
      }
      if (shapeId) {
        tableById(shapeId).shape = event.target.value;
        render();
        scheduleSave();
      }
      if (capacityId) {
        setCapacity(tableById(capacityId), event.target.value);
      }
    });

    els.columns.addEventListener("keydown", event => {
      if (!event.target.dataset.tableName || event.key !== "Enter") return;
      event.preventDefault();
      event.target.blur();
    });

    els.columns.addEventListener("click", event => {
      const tableId = event.target.dataset.selectTable;
      if (!tableId) return;
      selectTable(tableId);
      document.querySelector(".canvas-shell").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    initializeApp();
  </script>
</body>
